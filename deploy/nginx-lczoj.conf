# =============================================================================
#  LCZOJ 站点反代配置示例（宝塔 / 小皮面板的 Nginx 站点可直接用）
#
#  ⚠ 本文件只适用于「Nginx / 面板反代」路线：服务监听 127.0.0.1:3000。
#     裸机一键部署脚本 install-ubuntu.sh / install-centos.sh **不安装 Nginx**，
#     它们让服务直接监听 0.0.0.0:80（OJ_HOST=0.0.0.0、PORT=80），用不到本文件。
#     两边的端口必须一致：单元里 PORT=3000 + OJ_HOST=127.0.0.1 ↔ 这里的 proxy_pass 3000。
#     只把服务设成 127.0.0.1 却没有配反代 = 外网必然打不开。
#
#  用法（宝塔面板）：
#    网站 → 你的站点 → 反向代理 → 添加反向代理
#      代理名称：lczoj    目标 URL：http://127.0.0.1:3000
#      发送域名：$host
#    然后到「配置文件」里补上下面的 client_max_body_size / proxy_read_timeout
#    （面板默认值偏小，会让 32MB 的答案 ZIP 上传报 413）
#
#  用法（小皮面板 / 手工 Nginx）：
#    把下面的 location / 段落粘贴到站点配置的 server { } 里
# =============================================================================

# 提交代码 / 上传答案文件都走这个站点，请求体上限要 ≥ 64m（服务端上限 64MB）
client_max_body_size 64m;

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    # 站点依赖 keep-alive 复用连接（server.js 里 keepAliveTimeout = 65s），
    # 反代超时必须大于它，否则长连接会被 Nginx 提前掐断
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 30s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";

    # 评测输出/题面可能较大，关闭缓冲避免长响应被截断
    proxy_buffering off;
}

# 健康检查（可选）：面板的监控 / 负载均衡可探测这个地址
location = /api/health {
    proxy_pass http://127.0.0.1:3000/api/health;
    access_log off;
}
