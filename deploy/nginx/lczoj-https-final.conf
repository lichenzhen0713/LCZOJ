# =============================================================================
#  LCZOJ 站点配置 —— 完整版（HTTP + HTTPS，可直接用于 https 访问）
#  域名：oj.lichenzhen.cn        后端：http://127.0.0.1:3000
#
#  ★ 使用前只需要改 3 处（其余原样粘）：
#    1) 两处 server_name          → 你的域名
#    2) 两处 / 一处 root          → 面板里该站点的「网站目录」
#    3) 443 里的 ssl_certificate / ssl_certificate_key
#       → 用下面命令查出来的真实路径（不要用示例路径）：
#         sudo nginx -T 2>/dev/null | grep -E '^\s*ssl_certificate(_key)?\s' | sort -u
#         或：for p in $(pgrep -f nginx); do sudo lsof -p "$p"; done | grep -E '\.(pem|key)$'
#
#  【放置】小皮面板 → 网站 → oj.lichenzhen.cn → Nginx 设置 / 站点配置 → 整段替换
#  【生效】sudo nginx -t && sudo systemctl reload nginx
#
#  ⚠ 本文件刻意**不使用**下面这些容易把 Nginx 搞挂/搞 403 的写法：
#      × upstream { }        （面板里已有一份就会 duplicate upstream 启动失败）
#      × http2 on;           （Nginx < 1.25.1 不支持，会 unknown directive）
#      × root / index / try_files 放在 server 层级（会让请求当静态文件 → 403）
#      × location ~ \.php$   （本站不使用 PHP）
# =============================================================================

# ======================= 80：只做 ACME 校验 + 跳转 HTTPS =======================
server {
    listen 80;
    listen [::]:80;
    server_name oj.lichenzhen.cn;            # ← 改成你的域名

    # 提交代码 / 上传答案包上限（太小会 413）
    client_max_body_size 64m;

    # ACME 校验：必须走本地文件（^~ 优先级最高，不会被反代抢走）
    # ★ root 必须 = 面板里该站点的「网站目录」，且目录可读
    location ^~ /.well-known/acme-challenge/ {
        root /www/server/phpstudy/www/oj.lichenzhen.cn;
        default_type text/plain;
        try_files $uri =404;
    }

    # 其余全部跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================ 443：SSL + 反代到 LCZOJ ============================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # 想要 HTTP/2：Nginx ≥ 1.25.1 加一行 http2 on; ；老版本改成 listen 443 ssl http2;
    # 不确定就先别加，本站 HTTP/1.1 完全够用，且 keep-alive 已由后端保证。

    server_name oj.lichenzhen.cn;            # ← 改成你的域名

    # ★★★ 证书路径：用你面板签出来的真实文件（下面给的是常见示例，务必替换）★★★
    ssl_certificate     /www/server/phpstudy/vhost/cert/oj.lichenzhen.cn/fullchain.pem;
    ssl_certificate_key /www/server/phpstudy/vhost/cert/oj.lichenzhen.cn/privkey.pem;
    # certbot 路径示例：     /etc/letsencrypt/live/oj.lichenzhen.cn/{fullchain.pem,privkey.pem}
    # acme.sh 路径示例：     /root/.acme.sh/oj.lichenzhen.cn/{fullchain.cer,oj.lichenzhen.cn.key}

    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;
    ssl_prefer_server_ciphers off;

    client_max_body_size 64m;

    # （可选）HSTS：确认全站 HTTPS 没问题后再打开这行
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # 证书续期也要能校验（80 已跳转时靠这条兜底）
    location ^~ /.well-known/acme-challenge/ {
        root /www/server/phpstudy/www/oj.lichenzhen.cn;
        default_type text/plain;
        try_files $uri =404;
    }

    # ---------------- LCZOJ 后端反代 ----------------
    location / {
        proxy_pass http://127.0.0.1:3000;      # ← 直接用地址，不用 upstream
        proxy_http_version 1.1;

        # 必须大于 LCZOJ 的 keepAliveTimeout(65s)
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 30s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # ★ OJ 靠它识别 https，不要删
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        # 评测输出 / 题面可能较大，关闭缓冲避免长响应被截断
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 健康检查（面板监控 / 负载均衡可探测）
    location = /api/health {
        proxy_pass http://127.0.0.1:3000/api/health;
        access_log off;
    }
}
