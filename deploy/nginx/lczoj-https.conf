# =============================================================================
#  LCZOJ × 小皮面板 —— 阶段 2：80 + 443（证书已签发后使用）
#  域名：oj.lichenzhen.cn      后端：http://127.0.0.1:3000
#
#  前置条件（先跑 deploy/setup-ssl.sh，或自己签好）：
#    证书：/etc/nginx/ssl/oj.lichenzhen.cn.pem   （fullchain：站点证书 + 中间证书）
#    私钥：/etc/nginx/ssl/oj.lichenzhen.cn.key
#  ⚠ 这两个文件不存在时 nginx -t 会报 "cannot load certificate"，先签证书再用本文件。
#
#  【生效】sudo nginx -t && sudo nginx -s reload
# =============================================================================

upstream lczoj_backend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ============================ 80：ACME + 跳 HTTPS ============================
server {
    listen 80;
    listen [::]:80;
    server_name oj.lichenzhen.cn;

    client_max_body_size 64m;

    # ACME 校验必须继续可用（Let's Encrypt 续期走 80）
    location ^~ /.well-known/acme-challenge/ {
        root /www/server/phpstudy/www/oj.lichenzhen.cn;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ================================ 443：反代 ================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                     # Nginx < 1.25.1：改成 listen 443 ssl http2; 并删掉本行

    server_name oj.lichenzhen.cn;

    ssl_certificate     /etc/nginx/ssl/oj.lichenzhen.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/oj.lichenzhen.cn.key;

    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;
    ssl_prefer_server_ciphers off;

    client_max_body_size 64m;

    # 续期时如果 80 被跳转，这里也保留一份，双保险
    location ^~ /.well-known/acme-challenge/ {
        root /www/server/phpstudy/www/oj.lichenzhen.cn;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://lczoj_backend;
        proxy_http_version 1.1;

        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 30s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # ★ OJ 靠它识别 https
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /api/health {
        proxy_pass http://lczoj_backend/api/health;
        access_log off;
    }
}
