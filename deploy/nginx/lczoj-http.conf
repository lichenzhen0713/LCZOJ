# =============================================================================
#  LCZOJ × 小皮面板 —— 阶段 1：只要 80（用于签发证书）
#  文件用途：证书还没签时先用这份，保证 ACME 校验能读到文件、站点也能访问
#  域名：oj.lichenzhen.cn      后端：http://127.0.0.1:3000
#
#  【放哪里】小皮面板 → 网站 → oj.lichenzhen.cn → Nginx 设置（或站点配置），
#            整段替换原内容；也可放到 vhost 目录（用下面命令查）：
#              grep -rn "include.*vhost" /www/server/phpstudy/nginx/conf/nginx.conf
#  【生效】  sudo nginx -t && sudo nginx -s reload
#  【证书签好后】把本文件换成 lczoj-https.conf
#
#  ⚠ 本文件里 root 路径必须与你面板里该站点的「网站目录」一致：
#      sudo nginx -T | grep -A30 'server_name oj.lichenzhen.cn' | grep root
# =============================================================================

upstream lczoj_backend {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name oj.lichenzhen.cn;

    # 提交代码 / 上传答案包上限（太小会 413）
    client_max_body_size 64m;

    # ---- ACME 校验（Let's Encrypt 靠它，必须走本地文件；^~ 优先级最高）----
    location ^~ /.well-known/acme-challenge/ {
        root /www/server/phpstudy/www/oj.lichenzhen.cn;
        default_type text/plain;
        try_files $uri =404;
    }

    # ---- 其余请求反代给 LCZOJ ----
    location / {
        proxy_pass http://lczoj_backend;
        proxy_http_version 1.1;

        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 30s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_request_buffering off;

        # 不要写 root / index / try_files / location ~ \.php$（会抢走 location / → 403）
    }

    location = /api/health {
        proxy_pass http://lczoj_backend/api/health;
        access_log off;
    }
}
