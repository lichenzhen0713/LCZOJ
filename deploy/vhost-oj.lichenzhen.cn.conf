# =============================================================================
#  LCZOJ 站点 vhost —— 小皮面板 / 原生 Nginx 通用
#  域名：oj.lichenzhen.cn        后端：http://127.0.0.1:3000
#
#  【放置位置】替换面板里该站点原有的 vhost 文件（小皮通常在
#    /www/server/phpstudy/nginx/conf/vhost/ 或 /www/server/phpstudy/vhost/ 下，
#    可用：grep -rn "include.*vhost" /www/server/phpstudy/nginx/conf/nginx.conf 查）
#
#  【生效】
#    sudo nginx -t && sudo nginx -s reload
#
#  【证书还没签时】必须先把下面两处注释掉，否则 nginx -t 会报
#    "cannot load certificate"：
#      ① 80 块里的  location / { return 301 ... }
#      ② 整个 443 server 块
#    签好证书后再取消注释（证书路径见 443 块）。
#
#  【签证书】用 webroot 模式，和本文件里的 acme-challenge 目录严格对应：
#    sudo certbot certonly --webroot -w /www/server/phpstudy/www/oj.lichenzhen.cn -d oj.lichenzhen.cn
#    （或 acme.sh --issue -d oj.lichenzhen.cn -w 同一个目录）
# =============================================================================

# ---------- 后端（下面两个 server 共用一个 upstream） ----------
upstream lczoj_backend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# =============================================================================
#  80：只做两件事 —— ACME 校验（必须走本地文件）、其余跳 443
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name oj.lichenzhen.cn;

    # 提交代码 / 上传答案包上限（太小会 413）
    client_max_body_size 64m;

    # ① ACME 校验：放在 location / 之前，^~ 优先级更高，不会被反代抢走
    #    root 必须 = 该站点的根目录（certbot -w 也要用同一个目录）
    location ^~ /.well-known/acme-challenge/ {
        root /www/server/phpstudy/www/oj.lichenzhen.cn;
        default_type text/plain;
        try_files $uri =404;
    }

    # ② 其余全部跳 HTTPS（证书没签好前先注释这一行）
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
#  443：反代到 LCZOJ
#  （证书没签好前整块注释掉）
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # Nginx < 1.25.1 请改成：listen 443 ssl http2; 并删掉本行

    server_name oj.lichenzhen.cn;

    # ---------- 证书（certbot 默认路径；用 acme.sh 的改成 --install-cert 的输出路径） ----------
    ssl_certificate     /etc/letsencrypt/live/oj.lichenzhen.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oj.lichenzhen.cn/privkey.pem;

    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;
    ssl_prefer_server_ciphers off;

    # 申请/续期证书时也要能访问校验路径（续期走 80 即可，这里保险起见也保留）
    location ^~ /.well-known/acme-challenge/ {
        root /www/server/phpstudy/www/oj.lichenzhen.cn;
        default_type text/plain;
        try_files $uri =404;
    }

    client_max_body_size 64m;

    # ---------- LCZOJ 后端 ----------
    location / {
        proxy_pass http://lczoj_backend;
        proxy_http_version 1.1;

        # 必须大于 LCZOJ 的 keepAliveTimeout(65s)，否则长连接被 Nginx 提前掐断
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 30s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # ★ OJ 靠它识别 https，不要删
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        # 评测输出 / 题面可能较大，关闭缓冲避免被截断
        proxy_buffering off;
        proxy_request_buffering off;

        # 不要在这里写 root / index / try_files，也不要有 location ~ \.php$
    }

    # 健康检查（面板监控可探这个地址）
    location = /api/health {
        proxy_pass http://lczoj_backend/api/health;
        access_log off;
    }
}

# =============================================================================
#  旧内容必须删除（403 的根源），如原配置里有以下任何一项请删掉：
#     root  /www/server/phpstudy/www/xxx;   # 会让 Nginx 当静态目录处理请求
#     index index.php index.html;           # 找不到 index → 403
#     try_files $uri $uri/ =404;            # 同上，且会绕过 proxy_pass
#     location ~ \.php$ { ... }             # 本站不使用 PHP
# =============================================================================
