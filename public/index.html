  <!-- 图标走 CDN：媒体查询 + onload 切换，避免外网样式表阻塞首屏渲染（图标稍后补上） -->
  <link rel="preconnect" href="https://cdn.bootcdn.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.bootcdn.net" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="dns-prefetch" href="https://unpkg.com" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" id="fa-css" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" /></noscript>
  <script>
    // Font Awesome 多 CDN 回退：任一源失败自动尝试下一个，避免图标因单个 CDN 故障而无法加载
    (function () {
      var FA_URLS = [
        'https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css',
        'https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css',
        'https://unpkg.com/@fortawesome/fontawesome-free@6.5.1/css/all.min.css',
        'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css',
      ];
      var i = 1;
      function loadNext() {
        if (i >= FA_URLS.length) return;
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = FA_URLS[i++];
        l.crossOrigin = 'anonymous';
        l.media = 'print';
        l.onload = function () { l.media = 'all'; };
        l.onerror = function () { try { l.remove(); } catch (e) {} loadNext(); };
        document.head.appendChild(l);
      }
      var first = document.getElementById('fa-css');
      // 首个 CDN 失败时回退；成功时用 onload 把 media 切回 all
      if (first) first.addEventListener('error', function () { try { first.remove(); } catch (e) {} loadNext(); });
    })();
  </script>
